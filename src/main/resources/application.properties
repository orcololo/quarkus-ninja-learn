quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.application.name=db-service
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=groups
quarkus.rest-client.keycloak-admin.disable-default-mapper=true
quarkus.rest-client.elasticsearch.disable-default-mapper=true
quarkus.rest-client.keycloak-admin.connect-timeout=5000
quarkus.rest-client.keycloak-admin.read-timeout=10000
keycloak.realm=ninja
keycloak.provisioner.client-id=ninja-provisioner
%dev.keycloak.provisioner.client-secret=local-provisioner-secret
%test.keycloak.provisioner.client-secret=test-provisioner-secret
%dev.quarkus.rest-client.keycloak-admin.url=http://localhost:8180
%test.quarkus.rest-client.keycloak-admin.url=http://localhost:8180
%dev.quarkus.rest-client.elasticsearch.url=http://localhost:9200
%test.quarkus.rest-client.elasticsearch.url=http://localhost:9200
%prod.quarkus.rest-client.keycloak-admin.url=${KEYCLOAK_ADMIN_URL}
%prod.quarkus.rest-client.elasticsearch.url=${ELASTICSEARCH_URL}
%prod.elasticsearch.api-key=${ELASTICSEARCH_API_KEY}
%prod.keycloak.provisioner.client-secret=${KEYCLOAK_PROVISIONER_CLIENT_SECRET}
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/ninja
%prod.quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL}
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.scheduler.enabled=false
%test.quarkus.otel.sdk.disabled=true