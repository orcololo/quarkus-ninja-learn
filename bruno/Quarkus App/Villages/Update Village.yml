info:
  name: Update Village
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/villages/{{villageId}}"
  headers:
    - name: Authorization
      value: "Bearer {{adminToken}}"
  body:
    type: json
    data: |-
      {
        "name": "Leaf",
        "location": "Land of Fire",
        "description": "The hidden village of the leaf",
        "type": "HIDDEN"
      }
  auth: inherit
