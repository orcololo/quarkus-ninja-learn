info:
  name: Create Owned Ninja
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/users/me/ninjas"
  headers:
    - name: Authorization
      value: "Bearer {{accountToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "My Ninja",
        "age": 12,
        "level": "BEGINNER"
      }
  auth: inherit
