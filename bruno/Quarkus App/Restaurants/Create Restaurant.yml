info:
  name: Create Restaurant
  type: http
  seq: 36

http:
  method: POST
  url: "{{baseUrl}}/restaurants"
  headers:
    - name: Authorization
      value: "******"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Sakura Ramen",
        "description": "Ramen and Japanese comfort food",
        "address": "1 Market Street",
        "city": "San Francisco",
        "cuisine": "JAPANESE",
        "latitude": 37.7936,
        "longitude": -122.3965,
        "openingHours": {
          "timeZone": "America/Los_Angeles",
          "periods": [
            {"dayOfWeek": "MONDAY", "opensAt": "11:00", "closesAt": "22:00"},
            {"dayOfWeek": "TUESDAY", "opensAt": "11:00", "closesAt": "22:00"},
            {"dayOfWeek": "WEDNESDAY", "opensAt": "11:00", "closesAt": "22:00"},
            {"dayOfWeek": "THURSDAY", "opensAt": "11:00", "closesAt": "22:00"},
            {"dayOfWeek": "FRIDAY", "opensAt": "11:00", "closesAt": "23:00"},
            {"dayOfWeek": "SATURDAY", "opensAt": "10:00", "closesAt": "23:00"},
            {"dayOfWeek": "SUNDAY", "opensAt": "10:00", "closesAt": "21:00"}
          ]
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status !== 201 || typeof res.body?.id !== "number") {
          throw new Error(`Restaurant creation failed (${res.status})`);
        }
        bru.setEnvVar("restaurantId", String(res.body.id));
